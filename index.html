    <!-- Structured Data / JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "SageCodes",
        "url": "https://sagecodes.com",
        "logo": "https://sagecodes.com/transparentlogo.png",
        "description": "Custom web development, e-commerce solutions, platform optimization, and technical consulting services",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "US"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer service",
          "availableLanguage": "English"
        },
        "sameAs": [
          "https://linkedin.com/company/sagecodes",
          "https://github.com/sagecodes"
        ],
        "serviceType": [
          "Web Development",
          "E-commerce Solutions",
          "Platform Optimization",
          "Technical Consulting"
        ]
      }
    </script>

    <!-- Additional Structured Data for Services -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

        },
        "description": "Professional custom web development services tailored to your business needs",
        "areaServed": "Worldwide",
        "serviceType": "Web Development"
